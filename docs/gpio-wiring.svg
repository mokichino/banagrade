<text x="846" y="502" text-anchor="end" font-weight="bold">← black wire to Pin 14 (GND)</text>
<text x="60" y="560" font-weight="bold">Check before powering on</text>
<text x="60" y="582" fill="#333">1. Find pin 1 (3.3V) first: it is the end of the header nearest the board's corner screw, on the right in your photo.</text>
<text x="60" y="602" fill="#333">2. Top row from the right: pins 1, 3, 5, 7, 9, 11, 13, 15. Pin 11 is the 6th top pin from the right end.</text>
<text x="60" y="622" fill="#333">3. Bottom row from the right: pins 2, 4, 6, 8, 10, 12, 14, 16. Pin 14 is the 7th and pin 16 the 8th from the right.</text>
<text x="60" y="642" fill="#333">4. Pins 11, 13, 15 are in the top row. Pins 14 and 16 are in the bottom row.</text>
<text x="60" y="690" fill="#b00" font-weight="bold">Power the Pi off while wiring. Never connect a GPIO pin to the 5V pins (1, 2, 4).</text>
